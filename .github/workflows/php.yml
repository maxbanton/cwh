name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: make PHP=${{ matrix.php }} build-svc

      - name: Composer install
        run: make PHP=${{ matrix.php }} install

      - name: Lint
        run: make PHP=${{ matrix.php }} lint

      - name: Tests
        run: make PHP=${{ matrix.php }} test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: make PHP=8.4 build-svc

      - name: Composer install
        run: make PHP=8.4 install

      - name: Run tests with coverage
        run: make PHP=8.4 test-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: clover-coverage
          path: build/logs/clover.xml
          if-no-files-found: error
